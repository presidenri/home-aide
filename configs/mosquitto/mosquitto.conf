# Mosquitto MQTT broker configuration for Frigate and Home Assistant

# Basic configuration
listener 1883
protocol mqtt

# WebSocket support for browser clients
listener 9001
protocol websockets

# Authentication - users are in passwd (gitignored), see README "MQTT Configuration"
allow_anonymous false
password_file /mosquitto/config/passwd

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Connection settings
max_keepalive 300
max_connections 1000
